---
name: Publish new version

on:
  push:
    branches:
      - main
      - rc
  # Publishes a preview for a single topic branch. The branch must already be
  # listed in `.releaserc.js`, which is what gives the run its `preview-…`
  # prerelease identifier and `preview` channel.
  workflow_dispatch:

jobs:
  publish-new-version:
    name: Publish new version
    runs-on: ubuntu-latest
    environment: publisher
    # A dispatch is only meaningful on a topic branch; without this guard the
    # dropdown would also offer `main` and `rc`, which already release on push.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      startsWith(github.ref_name, 'feat/') ||
      startsWith(github.ref_name, 'bug/') ||
      startsWith(github.ref_name, 'chore/')
    outputs:
      new_release_published: ${{ steps.semantic-release.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic-release.outputs.new_release_version }}
    steps:
      - name: Create GitHub app token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      # No signing key is imported and no git identity is configured: the only
      # commit of this job is created through the GitHub API by
      # `@jno21/semantic-release-github-commit`, and GitHub signs it precisely
      # because it carries no author or committer. Setting `GIT_AUTHOR_*` or
      # `GIT_COMMITTER_*` here — even to the app's own bot identity — would be
      # passed to the commit API and silently drop the signature.
      - name: Publish version
        uses: cycjimmy/semantic-release-action@v4
        id: semantic-release
        with:
          # semantic-release bundles none of this, and it is pinned so a release
          # never picks up a new version of a plugin that writes to the repository
          # on its own. The manifest plugin in `tools/` is local and needs no
          # installation.
          extra_plugins: |
            semantic-release-gitmoji
            @jno21/semantic-release-github-commit@1.0.1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # `@jno21/semantic-release-github-commit` syncs the release commit by running
      # `git remote set-url origin https://x-access-token:$TOKEN@github.com/...`
      # and never reverts it, which leaves the App installation token in
      # `.git/config` and in `.git/FETCH_HEAD`. `persist-credentials: false` does
      # not help: this re-adds the credential after checkout. On a hosted runner
      # the workspace is discarded, but the token stays live for the rest of the
      # job and would survive in any cached or self-hosted workspace, so it is
      # scrubbed here instead of being left as a known exposure.
      - name: Remove the token from the checkout
        if: always()
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          # Restore the remote to its credential-free form rather than dropping
          # the line, so the checkout is left in a usable state.
          url=$(git config --get remote.origin.url || true)
          if [ -n "$url" ] && [ "${url#*"$TOKEN"}" != "$url" ]; then
            git remote set-url origin "${url//x-access-token:$TOKEN@/}"
            echo 'Restored a credential-free origin URL'
          fi

          if [ -f .git/FETCH_HEAD ] && grep -qF "$TOKEN" .git/FETCH_HEAD; then
            grep -vF "$TOKEN" .git/FETCH_HEAD > .git/FETCH_HEAD.tmp || true
            mv .git/FETCH_HEAD.tmp .git/FETCH_HEAD
            echo 'Removed the token from .git/FETCH_HEAD'
          fi

          if grep -rqF "$TOKEN" .git/config .git/FETCH_HEAD 2>/dev/null; then
            echo '::error::The App token is still present in the checkout'
            exit 1
          fi
